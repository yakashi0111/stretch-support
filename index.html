<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Stretch Tool</title>
<style>
:root {
    --bg: #0b0c0f;
    --surface: #15171c;
    --surface-2: #1d2027;
    --card: #1a1c22;
    --border: #262a32;
    --text: #f2f3f5;
    --muted: #7b8190;
    --green: #34d399;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --red: #f87171;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
}
button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
button:disabled { opacity: .35; cursor: default; }
input, select, textarea {
    font-family: inherit; font-size: 1rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; }

/* ===== メイン画面 ===== */
.app {
    height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
}
.top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: .95rem; font-weight: 600; max-width: 75%;
}
.chip span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .caret { color: var(--muted); font-size: .75rem; }
.icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    display: grid; place-items: center;
}
.icon-btn svg { width: 22px; height: 22px; fill: var(--muted); }

.stats { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { background: var(--surface); border-radius: 12px; padding: 9px 6px; text-align: center; }
.stat-label { display: block; font-size: .65rem; letter-spacing: .12em; color: var(--muted); margin-bottom: 2px; }
.stat-value { font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-value small { color: var(--muted); font-weight: 400; font-size: .9rem; }

.overall { width: 100%; height: 5px; background: var(--surface-2); border-radius: 3px; margin-top: 12px; overflow: hidden; }
#overall-bar { height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .2s linear; }

.timer-wrap { flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }
.timer-container {
    position: relative; width: min(82vw, 100%, 42dvh, 420px); aspect-ratio: 1;
    display: grid; place-items: center;
}
.timer-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-bg { fill: none; stroke: var(--surface-2); stroke-width: 6; }
.timer-bar { fill: none; stroke: var(--green); stroke-width: 8; stroke-linecap: round; transition: stroke .25s; }
.inner-ui { position: relative; text-align: center; width: 78%; }
#phase-label { font-size: .7rem; letter-spacing: .25em; color: var(--muted); }
#current-title {
    margin: 6px 0 2px; font-size: clamp(1.1rem, 5vw, 1.7rem); font-weight: 500;
    line-height: 1.25; min-height: 2.5em; display: flex; align-items: center; justify-content: center;
    word-break: break-word;
}
#time-display {
    font-size: clamp(3.8rem, 17vw, 6.8rem); font-weight: 200; line-height: 1;
    font-variant-numeric: tabular-nums;
}

.controls { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
.side-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    font-size: .62rem; letter-spacing: .1em; color: var(--muted);
}
.side-btn svg { width: 22px; height: 22px; fill: var(--text); }
.side-btn:active:not(:disabled) { background: var(--surface-2); }
#main-btn {
    min-width: 160px; height: 68px; padding: 0 30px; border-radius: 999px;
    font-size: 1.15rem; font-weight: 700; letter-spacing: .08em; color: #04130c;
    background: var(--green); transition: background .2s, transform .1s;
}
#main-btn:active:not(:disabled) { transform: scale(.97); }
#main-btn.running { background: var(--red); color: #1c0606; }
#next-up { margin-top: 14px; min-height: 1.4em; font-size: .9rem; color: var(--muted); text-align: center; }
#next-up b { color: var(--text); font-weight: 500; }

/* ===== オーバーレイ共通 ===== */
.overlay {
    position: fixed; inset: 0; z-index: 200; display: flex;
    background: rgba(0,0,0,.62); align-items: flex-end; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity .26s ease, visibility 0s linear .26s;
}
.overlay.open { opacity: 1; visibility: visible; transition: opacity .26s ease, visibility 0s; }
.sheet {
    width: 100%; max-width: 560px; max-height: 85dvh; overflow-y: auto;
    background: var(--card); border-radius: 28px 28px 0 0;
    padding: 18px 18px max(22px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.overlay.open .sheet { transform: none; }
.sheet h3 { margin: 0 0 14px; font-size: 1rem; }
.sheet .row { display: flex; gap: 8px; margin-top: 10px; }
.sheet textarea { width: 100%; min-height: 96px; resize: vertical; font-size: .8rem; word-break: break-all; }
.note { font-size: .78rem; color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
.btn {
    flex: 1; padding: 13px 14px; border-radius: 10px; font-weight: 600; font-size: .95rem;
    background: var(--surface-2); border: 1px solid var(--border);
}
.btn.primary { background: var(--blue); color: #06121f; border-color: transparent; }
.btn.danger { color: var(--red); }
.btn.armed { background: var(--red); color: #1c0606; }

/* ===== ルーティーン一覧ページ ===== */
.page {
    position: fixed; inset: 0; z-index: 150; display: none;
    background: var(--bg); overflow-y: auto;
}
.page.open { display: block; }
.page-inner { max-width: 560px; margin: 0 auto; padding: 0 18px max(28px, env(safe-area-inset-bottom)); }
.page-head {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 0 12px;
}
.page-head h2 { margin: 0; font-size: 1.7rem; font-weight: 700; }
.page-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 24px; }
.page-actions button {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 54px; border-radius: 14px; background: var(--card);
    font-size: 1rem; font-weight: 600;
}
.page-actions svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.page-sub { font-size: .95rem; color: var(--muted); margin: 0 0 12px 2px; }

.rc {
    background: var(--card); border-radius: 18px; padding: 16px;
    margin-bottom: 14px; border: 1px solid transparent;
}
.rc.active { border-color: rgba(52, 211, 153, .4); }
.rc-top { display: flex; align-items: center; gap: 6px; }
.rc-title { flex: 1; min-width: 0; display: flex; align-items: baseline; }
.rc-name {
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 1.32rem; font-weight: 700; line-height: 1.3;
}
.rc-time { flex: none; white-space: nowrap; margin-left: .45em; font-size: 1.1rem; font-weight: 500; color: #c3c7d1; }
.rc-more {
    flex: none; width: 44px; height: 44px; margin: -6px -8px -6px 0;
    display: grid; place-items: center; border-radius: 50%; color: var(--muted);
}
.rc-more svg { width: 24px; height: 24px; fill: currentColor; }
.rc-more:active { background: var(--surface-2); }
.rc-preview {
    margin: 6px 0 0; font-size: .95rem; line-height: 1.5; color: #8b91a0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-word;
}
.rc-start {
    display: block; width: 100%; height: 50px; margin-top: 16px; border-radius: 12px;
    background: var(--green); color: #04130c; font-size: 1.05rem; font-weight: 700; letter-spacing: .06em;
}
.rc-start:active:not(:disabled) { transform: scale(.985); }

/* ===== 三点メニュー (ボトムシート) ===== */
.grabber { width: 44px; height: 5px; border-radius: 3px; background: #4a4f5b; margin: -6px auto 14px; }
.act-title {
    text-align: center; font-size: 1rem; padding-bottom: 16px;
    border-bottom: 1px solid var(--border); margin-bottom: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.act-list { background: var(--surface-2); border-radius: 16px; overflow: hidden; }
.act-row {
    width: 100%; height: 62px; display: flex; align-items: center; gap: 16px;
    padding: 0 18px; font-size: 1.02rem; text-align: left;
}
.act-row + .act-row { border-top: 1px solid var(--border); }
.act-row svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act-row:active:not(:disabled) { background: rgba(255,255,255,.05); }
.act-row.danger { color: var(--red); }
.act-sheet { padding-bottom: max(34px, calc(env(safe-area-inset-bottom) + 18px)); }

/* ===== 設定パネル ===== */
.settings-panel {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: var(--bg); overflow-y: auto;
}
.settings-panel.open { display: block; }
.settings-inner { max-width: 480px; margin: 0 auto; padding: 0 18px max(30px, env(safe-area-inset-bottom)); }
.settings-head {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 0 12px;
}
.settings-head h2 { margin: 0; font-size: 1.1rem; letter-spacing: .12em; }
.block { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.block-title { font-size: .7rem; letter-spacing: .18em; color: var(--muted); margin: 0 0 12px; }
.block input[type="text"], .block select { width: 100%; }
.btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.btn-grid .btn { padding: 11px 6px; font-size: .85rem; }

.slider-wrapper { display: flex; align-items: center; gap: 16px; }
.slider-wrapper input[type="range"] { flex: 1; }
.value-display { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
#wait-val-display { font-size: 2rem; font-weight: 200; color: var(--amber); }
.value-display .unit { color: var(--muted); margin-left: 3px; }

input[type="range"] { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; padding: 0; border: none; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--border); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; margin-top: -9px;
    background: var(--amber); box-shadow: 0 0 10px rgba(251,191,36,.35);
}
input[type="range"]::-moz-range-track { height: 4px; background: var(--border); border-radius: 2px; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border: none; border-radius: 50%; background: var(--amber); }

.stepper { display: flex; align-items: stretch; gap: 8px; margin: 10px 0; }
.stepper button { width: 52px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); font-size: 1.2rem; }
.stepper input { flex: 1; min-width: 0; text-align: center; font-size: 1.4rem; font-weight: 300; }
.stepper .unit { align-self: center; color: var(--muted); }
.chips { display: flex; gap: 6px; margin-bottom: 10px; }
.chips button { flex: 1; padding: 8px 0; border-radius: 8px; background: var(--surface-2); font-size: .85rem; color: var(--muted); }
.chips button.on { background: var(--blue); color: #06121f; font-weight: 700; }
.add-fields { display: grid; gap: 10px; }

.list-summary { font-size: .8rem; color: var(--muted); margin: 0 0 10px; }
.list-item {
    display: flex; align-items: center; gap: 8px; background: var(--surface-2);
    margin-bottom: 8px; padding: 8px 8px 8px 6px; border-radius: 12px;
}
.mv { display: flex; flex-direction: column; }
.mv button { width: 34px; height: 24px; color: var(--muted); font-size: .8rem; }
.mv button:disabled { opacity: .2; }
.item-info { flex: 1; min-width: 0; padding: 6px 4px; cursor: pointer; }
.item-info strong { font-weight: 600; }
.item-sub { color: var(--muted); font-size: .85rem; margin-left: 6px; }
.remove-btn { width: 40px; height: 40px; color: var(--red); font-size: 1.1rem; }
.list-item.editing { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; border: 1px solid var(--blue); }
.edit-row { display: flex; gap: 8px; align-items: center; }
.edit-row input[type="text"] { flex: 1; min-width: 0; }
.edit-row input[type="number"] { width: 90px; }
.edit-row select { flex: 1; }
.edit-row .unit { color: var(--muted); }

#toast {
    position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 56px)); transform: translateX(-50%) translateY(-12px);
    background: #fff; color: #000; padding: 10px 18px; border-radius: 999px; font-size: .9rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .2s; z-index: 500; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-height: 640px) {
    .stats { margin-top: 8px; }
    .stat { padding: 5px 4px; }
    .side-btn, #main-btn { height: 56px; }
    .side-btn { width: 56px; }
}
</style>
</head>
<body>

<div class="app">
    <header class="top">
        <button class="chip" id="routine-chip"><span id="routine-name">-</span><span class="caret">▼</span></button>
        <button class="icon-btn" id="open-settings" aria-label="設定">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
    </header>

    <section class="stats">
        <div class="stat"><span class="stat-label">進捗</span><span class="stat-value"><span id="st-step">0</span><small> / <span id="st-count">0</span></small></span></div>
        <div class="stat"><span class="stat-label">残り</span><span class="stat-value" id="st-remain">0:00</span></div>
        <div class="stat"><span class="stat-label">合計</span><span class="stat-value" id="st-total">0:00</span></div>
    </section>
    <div class="overall"><div id="overall-bar"></div></div>

    <div class="timer-wrap">
        <div class="timer-container">
            <svg class="timer-svg" viewBox="0 0 400 400">
                <circle class="timer-bg" cx="200" cy="200" r="190"></circle>
                <circle id="progress-bar" class="timer-bar" cx="200" cy="200" r="190"></circle>
            </svg>
            <div class="inner-ui">
                <div id="phase-label">READY</div>
                <h1 id="current-title">-</h1>
                <div id="time-display">0.0</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="side-btn" id="prev-btn" aria-label="前へ">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>PREV
        </button>
        <button id="main-btn">START</button>
        <button class="side-btn" id="skip-btn" aria-label="スキップ">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg>SKIP
        </button>
    </div>
    <div id="next-up"></div>
</div>

<!-- 設定 -->
<div class="settings-panel" id="panel">
  <div class="settings-inner">
    <div class="settings-head">
        <h2>MENU</h2>
        <button class="btn" style="flex:none;padding:9px 18px" id="close-settings">閉じる</button>
    </div>

    <div class="block">
        <p class="block-title">ROUTINE</p>
        <input type="text" id="set-routine-name" placeholder="ルーティーン名" maxlength="30">
        <div class="btn-grid">
            <button class="btn" id="btn-new">＋ 新規</button>
            <button class="btn" id="btn-dup">複製</button>
            <button class="btn danger" id="btn-del">削除</button>
            <button class="btn" id="btn-share">共有</button>
            <button class="btn" id="btn-import">取り込み</button>
            <button class="btn" id="btn-switch">切り替え</button>
        </div>
    </div>

    <div class="block">
        <p class="block-title">INTERVAL（種目間の休憩）</p>
        <div class="slider-wrapper">
            <input type="range" id="wait-sec-input" min="0" max="30" value="5">
            <div class="value-display"><span id="wait-val-display">5</span><span class="unit">s</span></div>
        </div>
    </div>

    <div class="block">
        <p class="block-title">ADD STRETCH</p>
        <div class="add-fields">
            <input type="text" id="new-name" placeholder="種目名" maxlength="40">
            <div>
                <div class="chips" id="dur-chips"></div>
                <div class="stepper">
                    <button id="dur-minus" aria-label="-5秒">−5</button>
                    <input type="number" id="dur-input" min="1" max="3600" inputmode="numeric" value="30">
                    <span class="unit">秒</span>
                    <button id="dur-plus" aria-label="+5秒">+5</button>
                </div>
            </div>
            <select id="side-type">
                <option value="both">1セット (両方)</option>
                <option value="single">2セット (左右交互)</option>
            </select>
            <button class="btn primary" id="add-btn">追加</button>
        </div>
    </div>

    <div class="block">
        <p class="block-title">LIST（タップで編集）</p>
        <p class="list-summary" id="list-summary"></p>
        <div id="item-list"></div>
    </div>
  </div>
</div>

<!-- ルーティーン一覧 -->
<div class="page" id="routines-page">
  <div class="page-inner">
    <div class="page-head">
        <h2>ルーティーン</h2>
        <button class="btn" style="flex:none;padding:9px 18px" id="close-page">閉じる</button>
    </div>
    <div class="page-actions">
        <button id="page-new">
            <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M12 9v7M8.5 12.5h7"/></svg>
            新規作成
        </button>
        <button id="page-import">
            <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>
            取り込み
        </button>
    </div>
    <p class="page-sub" id="page-sub"></p>
    <div id="routine-list"></div>
  </div>
</div>

<!-- 三点メニュー -->
<div class="overlay" id="sheet-actions">
  <div class="sheet act-sheet">
    <div class="grabber"></div>
    <div class="act-title" id="act-title"></div>
    <div class="act-list">
        <button class="act-row" id="act-share">
            <svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg>
            <span>ルーティーンを共有</span>
        </button>
        <button class="act-row" id="act-dup">
            <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
            <span>複製</span>
        </button>
        <button class="act-row" id="act-edit">
            <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1zM14.5 6.5l3 3"/></svg>
            <span>編集</span>
        </button>
        <button class="act-row danger" id="act-del">
            <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>
            <span>削除</span>
        </button>
    </div>
  </div>
</div>

<!-- 共有 -->
<div class="overlay" id="sheet-share">
  <div class="sheet">
    <h3>ルーティーンを共有</h3>
    <textarea id="share-code" readonly></textarea>
    <div class="row">
        <button class="btn primary" id="copy-code">コードをコピー</button>
        <button class="btn" id="copy-link">リンクをコピー</button>
    </div>
    <div class="row"><button class="btn" id="native-share">他のアプリで送る…</button></div>
    <p class="note">別の端末の「取り込み」にコードを貼り付けると同じルーティーンが使えます。リンクは、このページがウェブ上のURLで開かれているときに、他の端末でそのまま取り込めます。</p>
  </div>
</div>

<!-- 取り込み -->
<div class="overlay" id="sheet-import-box">
  <div class="sheet">
    <h3>ルーティーンを取り込む</h3>
    <textarea id="import-text" placeholder="共有コード、または共有リンクを貼り付け"></textarea>
    <p class="note" id="import-preview"></p>
    <div class="row">
        <button class="btn" data-close>キャンセル</button>
        <button class="btn primary" id="import-go" disabled>取り込む</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'stretch_v2';

/* ================= データ ================= */
function uid() { return Math.random().toString(36).slice(2, 9); }

function load() {
    try {
        const s = JSON.parse(localStorage.getItem(KEY));
        if (s && Array.isArray(s.routines) && s.routines.length) {
            if (!s.routines.some(r => r.id === s.activeId)) s.activeId = s.routines[0].id;
            return s;
        }
    } catch (e) {}
    // 旧バージョン(stretch_data / wait_time)からの移行
    let items = null, wait = 5;
    try { items = JSON.parse(localStorage.getItem('stretch_data')); } catch (e) {}
    try { const w = parseInt(localStorage.getItem('wait_time')); if (!isNaN(w)) wait = w; } catch (e) {}
    const r = {
        id: uid(), name: 'マイルーティーン', wait,
        items: (items && items.length) ? items : [{ name: 'ハム', time: 30, type: 'both' }]
    };
    return { routines: [r], activeId: r.id };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let state = load();
let queue = [];
const cur = () => state.routines.find(r => r.id === state.activeId) || state.routines[0];

function rebuild() {
    queue = [];
    cur().items.forEach(s => {
        if (s.type === 'single') {
            queue.push({ name: s.name + ' (左)', time: s.time });
            queue.push({ name: s.name + ' (右)', time: s.time });
        } else {
            queue.push({ name: s.name, time: s.time });
        }
    });
}
const routineTotalSec = r => {
    const steps = r.items.reduce((n, s) => n + (s.type === 'single' ? 2 : 1), 0);
    const t = r.items.reduce((n, s) => n + s.time * (s.type === 'single' ? 2 : 1), 0);
    return t + r.wait * Math.max(0, steps - 1);
};
function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    const ss = String(s).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}

/* ================= 音・バイブ・画面スリープ防止 ================= */
let actx = null;
function beep(freq = 800, dur = 0.2, vol = 0.3) {
    try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator(), g = actx.createGain();
        o.connect(g); g.connect(actx.destination);
        o.frequency.value = freq; o.type = 'sine';
        const t = actx.currentTime;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + dur);
        o.start(t); o.stop(t + dur);
    } catch (e) {}
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let wake = null;
async function requestWake() {
    try {
        if ('wakeLock' in navigator && !wake) {
            wake = await navigator.wakeLock.request('screen');
            wake.addEventListener('release', () => { wake = null; });
        }
    } catch (e) {}
}
function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => {
    if (running && document.visibilityState === 'visible') requestWake();
});

/* ================= タイマー ================= */
const circle = $('progress-bar');
const CIRC = 2 * Math.PI * circle.r.baseVal.value;
circle.style.strokeDasharray = `${CIRC} ${CIRC}`;

let phase = 'idle';          // idle | work | wait | done
let idx = 0, elapsed = 0, last = 0, running = false, timerId = null, lastTickKey = '';

const dur = () => phase === 'work' ? queue[idx].time * 1000
               : phase === 'wait' ? cur().wait * 1000 : 0;

function startLoop() {
    running = true; last = performance.now();
    clearInterval(timerId); timerId = setInterval(tick, 50);
    requestWake();
}
function stopLoop() {
    running = false; clearInterval(timerId); timerId = null; releaseWake();
}
function resetTimer() {
    stopLoop(); phase = 'idle'; idx = 0; elapsed = 0; lastTickKey = '';
}
function finish() {
    stopLoop(); phase = 'done'; elapsed = 0;
    beep(1000, 0.5); vibrate([300, 100, 300, 100, 300]);
}
function cue() { beep(800, 0.2); vibrate([200, 100, 200]); }

function advance() {
    if (phase === 'work') {
        if (idx + 1 < queue.length) { idx++; phase = cur().wait > 0 ? 'wait' : 'work'; cue(); }
        else finish();
    } else if (phase === 'wait') {
        phase = 'work'; cue();
    }
}
function tick() {
    const now = performance.now();
    elapsed += now - last; last = now;
    let guard = 0;
    while (running && elapsed >= dur() && guard++ < 50) { elapsed -= dur(); advance(); }
    if (running) {
        const sec = Math.ceil((dur() - elapsed) / 1000);
        const key = phase + idx + sec;
        if (sec >= 1 && sec <= 3 && key !== lastTickKey) { lastTickKey = key; beep(620, 0.07, 0.2); }
    }
    renderTimer();
}

function toggle() {
    if (!queue.length) return;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    if (running) { stopLoop(); renderTimer(); return; }
    if (phase === 'idle' || phase === 'done') { idx = 0; phase = 'work'; elapsed = 0; lastTickKey = ''; }
    startLoop(); renderTimer();
}
function skip() {
    if (phase === 'idle' || phase === 'done') return;
    elapsed = 0;
    if (phase === 'wait') { phase = 'work'; }
    else if (idx + 1 < queue.length) { idx++; phase = cur().wait > 0 ? 'wait' : 'work'; }
    else { finish(); }
    if (running) last = performance.now();
    renderTimer();
}
function prev() {
    if (phase === 'idle') return;
    if (phase === 'done') { idx = queue.length - 1; phase = 'work'; elapsed = 0; renderTimer(); return; }
    if ((phase === 'wait' || elapsed <= 3000) && idx > 0) { idx--; }
    phase = 'work'; elapsed = 0;
    if (running) last = performance.now();
    renderTimer();
}

function renderTimer() {
    const n = queue.length, wait = cur().wait;
    const totalMs = (queue.reduce((a, q) => a + q.time, 0) + wait * Math.max(0, n - 1)) * 1000;
    const before = i => queue.slice(0, i).reduce((a, q) => a + q.time, 0) * 1000;

    let completed = 0;
    if (phase === 'work') completed = before(idx) + wait * 1000 * idx + elapsed;
    else if (phase === 'wait') completed = before(idx) + wait * 1000 * (idx - 1) + elapsed;
    else if (phase === 'done') completed = totalMs;

    $('st-count').textContent = n;
    $('st-step').textContent = phase === 'idle' ? 0 : phase === 'done' ? n : idx + 1;
    $('st-total').textContent = fmt(totalMs / 1000);
    $('st-remain').textContent = fmt(Math.ceil((totalMs - completed) / 1000));
    $('overall-bar').style.width = (totalMs ? Math.min(100, completed / totalMs * 100) : 0) + '%';

    const title = $('current-title'), label = $('phase-label'), next = $('next-up');
    const btn = $('main-btn');
    let ringColor = 'var(--green)', offset = 0, shown = 0;

    if (!n) {
        label.textContent = 'EMPTY'; title.textContent = '種目を追加してください';
        $('time-display').textContent = '0.0'; next.textContent = '';
    } else if (phase === 'idle') {
        label.textContent = 'READY'; title.textContent = queue[0].name;
        shown = queue[0].time; next.innerHTML = 'STARTで開始';
    } else if (phase === 'done') {
        label.textContent = 'DONE'; title.textContent = 'FINISH!';
        next.textContent = 'おつかれさまでした';
    } else {
        const d = dur(), rem = Math.max(0, d - elapsed);
        shown = rem / 1000;
        offset = CIRC - (d ? rem / d : 0) * CIRC;
        if (phase === 'wait') {
            ringColor = 'var(--amber)'; label.textContent = 'INTERVAL'; title.textContent = 'NEXT: ' + queue[idx].name;
            next.innerHTML = 'SKIPで休憩を終了';
        } else {
            label.textContent = 'STRETCH'; title.textContent = queue[idx].name;
            const nx = queue[idx + 1];
            next.innerHTML = nx ? `次 <b></b>` : '最後の種目です';
            if (nx) next.querySelector('b').textContent = `${nx.name} · ${nx.time}秒`;
        }
    }
    if (n) $('time-display').textContent = shown.toFixed(1);
    circle.style.stroke = ringColor;
    circle.style.strokeDashoffset = offset;

    btn.disabled = !n;
    btn.classList.toggle('running', running);
    btn.textContent = running ? 'PAUSE' : (phase === 'work' || phase === 'wait') ? 'RESUME' : 'START';
    $('prev-btn').disabled = !n || phase === 'idle';
    $('skip-btn').disabled = !n || phase === 'idle' || phase === 'done';
}

/* ================= 画面更新 ================= */
function renderChip() { $('routine-name').textContent = cur().name || '(無題)'; }

function mutate(fn) {
    fn(); save(); resetTimer(); rebuild(); renderAll();
}
function renderAll() { renderChip(); renderSettings(); renderTimer(); renderRoutinePage(); }

function renderSettings() {
    const r = cur();
    if (document.activeElement !== $('set-routine-name')) $('set-routine-name').value = r.name;
    $('wait-sec-input').value = r.wait;
    $('wait-val-display').textContent = r.wait;
    $('btn-del').disabled = state.routines.length <= 1;
    renderList();
}

let editingIndex = -1;
function renderList() {
    const r = cur(), list = $('item-list');
    list.innerHTML = '';
    $('list-summary').textContent = r.items.length
        ? `${r.items.length}種目 ・ ${queue.length}ステップ ・ 合計 ${fmt(routineTotalSec(r))}`
        : 'まだ種目がありません';
    let focusTarget = null;

    r.items.forEach((s, i) => {
        if (i === editingIndex) {
            const el = buildEditItem(s, i);
            list.appendChild(el);
            focusTarget = el.querySelector('input[type="text"]');
            return;
        }
        const item = document.createElement('div');
        item.className = 'list-item';

        const mv = document.createElement('div');
        mv.className = 'mv';
        const up = document.createElement('button'); up.textContent = '▲'; up.disabled = i === 0; up.setAttribute('aria-label', '上へ');
        const dn = document.createElement('button'); dn.textContent = '▼'; dn.disabled = i === r.items.length - 1; dn.setAttribute('aria-label', '下へ');
        up.onclick = () => move(i, -1); dn.onclick = () => move(i, 1);
        mv.append(up, dn);

        const info = document.createElement('div');
        info.className = 'item-info';
        const st = document.createElement('strong'); st.textContent = s.name;
        const sub = document.createElement('span'); sub.className = 'item-sub';
        sub.textContent = `${s.time}秒${s.type === 'single' ? '・左右' : ''}`;
        info.append(st, sub);
        info.onclick = () => { editingIndex = i; renderList(); };

        const rm = document.createElement('button');
        rm.className = 'remove-btn'; rm.textContent = '✕'; rm.setAttribute('aria-label', '削除');
        rm.onclick = () => { editingIndex = -1; mutate(() => r.items.splice(i, 1)); };

        item.append(mv, info, rm);
        list.appendChild(item);
    });
    if (focusTarget) { focusTarget.focus(); focusTarget.select(); }
}
function move(i, d) {
    const items = cur().items, j = i + d;
    if (j < 0 || j >= items.length) return;
    editingIndex = -1;
    mutate(() => { const [m] = items.splice(i, 1); items.splice(j, 0, m); });
}

function buildEditItem(s, i) {
    const item = document.createElement('div');
    item.className = 'list-item editing';

    const nameRow = document.createElement('div'); nameRow.className = 'edit-row';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.value = s.name; nameInput.placeholder = '種目名'; nameInput.maxLength = 40;
    nameRow.appendChild(nameInput);

    const timeRow = document.createElement('div'); timeRow.className = 'edit-row';
    const timeInput = document.createElement('input');
    timeInput.type = 'number'; timeInput.min = 1; timeInput.max = 3600; timeInput.inputMode = 'numeric'; timeInput.value = s.time;
    const unit = document.createElement('span'); unit.className = 'unit'; unit.textContent = '秒';
    const typeSelect = document.createElement('select');
    typeSelect.innerHTML = '<option value="both">1セット (両方)</option><option value="single">2セット (左右交互)</option>';
    typeSelect.value = s.type || 'both';
    timeRow.append(timeInput, unit, typeSelect);

    const btnRow = document.createElement('div'); btnRow.className = 'edit-row';
    const saveBtn = document.createElement('button'); saveBtn.className = 'btn primary'; saveBtn.textContent = '保存';
    const cancelBtn = document.createElement('button'); cancelBtn.className = 'btn'; cancelBtn.textContent = 'キャンセル';
    btnRow.append(saveBtn, cancelBtn);

    const doSave = () => {
        const name = nameInput.value.trim();
        const time = parseInt(timeInput.value);
        if (!name) { nameInput.focus(); return; }
        if (!time || time < 1) { timeInput.focus(); return; }
        editingIndex = -1;
        mutate(() => { cur().items[i] = { name, time: Math.min(3600, time), type: typeSelect.value }; });
    };
    const doCancel = () => { editingIndex = -1; renderList(); };
    saveBtn.onclick = doSave; cancelBtn.onclick = doCancel;
    [nameInput, timeInput].forEach(el => el.onkeydown = e => {
        if (e.key === 'Enter') doSave();
        if (e.key === 'Escape') doCancel();
    });
    item.append(nameRow, timeRow, btnRow);
    return item;
}

/* ================= オーバーレイ ================= */
const openSheet = id => $(id).classList.add('open');
const closeSheet = id => $(id).classList.remove('open');
document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
    ov.querySelectorAll('[data-close]').forEach(b => b.onclick = () => ov.classList.remove('open'));
});

let toastTimer;
function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function openSettings() {
    if (running) { stopLoop(); renderTimer(); }
    $('panel').classList.add('open');
}
function closeSettings() {
    editingIndex = -1; renderList();
    $('panel').classList.remove('open');
}

/* ===== ルーティーン切り替え ===== */
function fmtJa(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? `${h}時間` : '') + (m ? `${m}分` : '') + (s || !(h || m) ? `${s}秒` : '');
}
const SVG_MORE = '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>';

function renderRoutinePage() {
    const box = $('routine-list'); box.innerHTML = '';
    $('page-sub').textContent = `マイルーティーン (${state.routines.length})`;
    state.routines.forEach(r => {
        const card = document.createElement('div');
        card.className = 'rc' + (r.id === state.activeId ? ' active' : '');

        const top = document.createElement('div'); top.className = 'rc-top';
        const title = document.createElement('div'); title.className = 'rc-title';
        const name = document.createElement('span'); name.className = 'rc-name'; name.textContent = r.name || '(無題)';
        const time = document.createElement('span'); time.className = 'rc-time';
        time.textContent = `- ${fmtJa(routineTotalSec(r))}`;
        title.append(name, time);
        const more = document.createElement('button');
        more.className = 'rc-more'; more.setAttribute('aria-label', 'メニュー'); more.innerHTML = SVG_MORE;
        more.onclick = () => openActions(r.id);
        top.append(title, more);

        const prev = document.createElement('p'); prev.className = 'rc-preview';
        prev.textContent = r.items.length ? r.items.map(s => s.name).join('、') : '種目がありません';

        const start = document.createElement('button');
        start.className = 'rc-start'; start.textContent = '開始'; start.disabled = !r.items.length;
        start.onclick = () => startRoutine(r.id);

        card.append(top, prev, start);
        box.appendChild(card);
    });
}
const openPage = () => { if (running) { stopLoop(); renderTimer(); } renderRoutinePage(); $('routines-page').classList.add('open'); };
const closePage = () => $('routines-page').classList.remove('open');

function activate(id) {
    state.activeId = id; save(); editingIndex = -1;
    resetTimer(); rebuild(); renderAll();
}
function startRoutine(id) {
    activate(id); closePage(); $('panel').classList.remove('open');
    toggle();
}
function newRoutine() {
    const r = { id: uid(), name: `ルーティーン ${state.routines.length + 1}`, wait: 5, items: [] };
    state.routines.push(r); activate(r.id);
    closePage(); openSettings();
    setTimeout(() => { $('set-routine-name').focus(); $('set-routine-name').select(); }, 50);
}
function duplicateRoutine(r) {
    const copy = { id: uid(), name: (r.name + ' のコピー').slice(0, 30), wait: r.wait, items: r.items.map(s => ({ ...s })) };
    state.routines.splice(state.routines.indexOf(r) + 1, 0, copy); save();
    return copy;
}
function deleteRoutine(id) {
    if (state.routines.length <= 1) return;
    const i = state.routines.findIndex(r => r.id === id);
    const wasActive = id === state.activeId;
    state.routines.splice(i, 1);
    if (wasActive) { state.activeId = state.routines[Math.max(0, i - 1)].id; editingIndex = -1; resetTimer(); }
    save(); rebuild(); renderAll();
}

/* ===== 三点メニュー ===== */
let actionId = null, actDelArmed = false;
function setActDelArmed(on) {
    actDelArmed = on;
    const b = $('act-del');
    b.querySelector('span').textContent = on ? 'もう一度タップで削除' : '削除';
}
function openActions(id) {
    actionId = id;
    const r = state.routines.find(x => x.id === id); if (!r) return;
    $('act-title').textContent = r.name || '(無題)';
    $('act-del').disabled = state.routines.length <= 1;
    setActDelArmed(false);
    openSheet('sheet-actions');
}
const actionRoutine = () => state.routines.find(x => x.id === actionId);

/* ===== 共有コード ===== */
function enc(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let s = ''; bytes.forEach(c => s += String.fromCharCode(c));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function dec(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    const bin = atob(str);
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
function shareCode(r) {
    return enc({ v: 1, n: r.name, w: r.wait, i: r.items.map(s => [s.name, s.time, s.type]) });
}
function parseShared(text) {
    try {
        text = (text || '').trim();
        const k = text.indexOf('#r=');
        if (k >= 0) text = text.slice(k + 3);
        text = text.replace(/\s+/g, '');
        if (!text) return null;
        const o = dec(text);
        if (!o || !Array.isArray(o.i)) return null;
        const items = o.i.map(a => ({
            name: String(a[0] || '').slice(0, 40),
            time: Math.min(3600, Math.max(1, parseInt(a[1]) || 30)),
            type: a[2] === 'single' ? 'single' : 'both'
        })).filter(s => s.name).slice(0, 100);
        if (!items.length) return null;
        const w = parseInt(o.w);
        return { id: uid(), name: String(o.n || '共有ルーティーン').slice(0, 30), wait: isNaN(w) ? 5 : Math.min(60, Math.max(0, w)), items };
    } catch (e) { return null; }
}
async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) {}
    const ta = $('share-code'); ta.focus(); ta.select();
    try { document.execCommand('copy'); toast(okMsg); } catch (e) { toast('コピーできませんでした'); }
}
let shareTarget = null;
function openShare(r) {
    shareTarget = r || cur();
    $('share-code').value = shareCode(shareTarget);
    openSheet('sheet-share');
}
const shareLink = () => location.href.split('#')[0] + '#r=' + shareCode(shareTarget || cur());

let pendingImport = null;
function openImport(prefill) {
    $('import-text').value = prefill || '';
    updateImportPreview();
    openSheet('sheet-import-box');
}
function updateImportPreview() {
    pendingImport = parseShared($('import-text').value);
    const p = $('import-preview');
    if (pendingImport) {
        p.textContent = `「${pendingImport.name}」 ${pendingImport.items.length}種目 ・ 合計 ${fmt(routineTotalSec(pendingImport))}`;
        p.style.color = 'var(--green)';
    } else {
        p.textContent = $('import-text').value.trim() ? 'コードを読み取れません' : '';
        p.style.color = 'var(--red)';
    }
    $('import-go').disabled = !pendingImport;
}

/* ================= イベント登録 ================= */
$('main-btn').onclick = toggle;
$('prev-btn').onclick = prev;
$('skip-btn').onclick = skip;
$('open-settings').onclick = openSettings;
$('close-settings').onclick = closeSettings;
$('routine-chip').onclick = openPage;
$('close-page').onclick = closePage;
$('page-new').onclick = newRoutine;
$('page-import').onclick = () => openImport('');
$('btn-new').onclick = newRoutine;
$('btn-switch').onclick = openPage;
$('btn-import').onclick = () => openImport('');
$('btn-share').onclick = () => openShare(cur());

$('act-share').onclick = () => { const r = actionRoutine(); closeSheet('sheet-actions'); if (r) openShare(r); };
$('act-dup').onclick = () => {
    const r = actionRoutine(); closeSheet('sheet-actions');
    if (r) { duplicateRoutine(r); renderAll(); toast('複製しました'); }
};
$('act-edit').onclick = () => {
    const id = actionId; closeSheet('sheet-actions');
    if (id) { activate(id); closePage(); openSettings(); }
};
$('act-del').onclick = () => {
    if (!actDelArmed) { setActDelArmed(true); return; }
    const id = actionId; closeSheet('sheet-actions');
    deleteRoutine(id); toast('削除しました');
};
$('copy-code').onclick = () => copyText($('share-code').value, 'コードをコピーしました');
$('copy-link').onclick = () => copyText(shareLink(), 'リンクをコピーしました');
$('native-share').onclick = async () => {
    const nm = (shareTarget || cur()).name;
    const data = { title: `ストレッチ: ${nm}`, text: `ストレッチルーティーン「${nm}」\n${shareLink()}` };
    if (navigator.share) { try { await navigator.share(data); } catch (e) {} }
    else copyText(shareLink(), 'リンクをコピーしました');
};
$('import-text').oninput = updateImportPreview;
$('import-go').onclick = () => {
    if (!pendingImport) return;
    state.routines.push(pendingImport); state.activeId = pendingImport.id; save();
    editingIndex = -1; resetTimer(); rebuild(); renderAll();
    closeSheet('sheet-import-box'); toast('取り込みました');
};

$('btn-dup').onclick = () => { activate(duplicateRoutine(cur()).id); toast('複製しました'); };
let delArmed = false, delTimer;
$('btn-del').onclick = () => {
    const b = $('btn-del');
    if (!delArmed) {
        delArmed = true; b.textContent = 'もう一度で削除'; b.classList.add('armed');
        delTimer = setTimeout(disarm, 3000); return;
    }
    disarm();
    deleteRoutine(state.activeId); toast('削除しました');
};
function disarm() {
    delArmed = false; clearTimeout(delTimer);
    const b = $('btn-del'); b.textContent = '削除'; b.classList.remove('armed');
}

$('set-routine-name').oninput = e => {
    cur().name = e.target.value.slice(0, 30); save(); renderChip();
};
$('wait-sec-input').oninput = e => {
    const v = parseInt(e.target.value) || 0;
    cur().wait = v; $('wait-val-display').textContent = v; save();
    if (phase !== 'idle') resetTimer();
    renderTimer();
};

// 追加フォーム: 秒数 (チップ + ステッパー)
let selectedSeconds = 30;
const CHIPS = [15, 30, 45, 60];
function setSeconds(v) {
    selectedSeconds = Math.min(3600, Math.max(1, parseInt(v) || 1));
    $('dur-input').value = selectedSeconds;
    $('dur-chips').querySelectorAll('button').forEach(b => b.classList.toggle('on', parseInt(b.dataset.s) === selectedSeconds));
}
CHIPS.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s + '秒'; b.dataset.s = s; b.onclick = () => setSeconds(s);
    $('dur-chips').appendChild(b);
});
$('dur-minus').onclick = () => setSeconds(selectedSeconds - 5);
$('dur-plus').onclick = () => setSeconds(selectedSeconds + 5);
$('dur-input').oninput = e => { selectedSeconds = parseInt(e.target.value) || selectedSeconds; $('dur-chips').querySelectorAll('button').forEach(b => b.classList.toggle('on', parseInt(b.dataset.s) === selectedSeconds)); };
$('dur-input').onchange = () => setSeconds($('dur-input').value);
setSeconds(30);

$('add-btn').onclick = () => {
    const name = $('new-name').value.trim();
    if (!name) { $('new-name').focus(); return; }
    setSeconds($('dur-input').value);
    editingIndex = -1;
    mutate(() => cur().items.push({ name, time: selectedSeconds, type: $('side-type').value }));
    $('new-name').value = '';
};
$('new-name').onkeydown = e => { if (e.key === 'Enter') $('add-btn').click(); };

/* ================= 起動 ================= */
rebuild();
renderAll();
if (location.hash.startsWith('#r=')) {
    const h = location.hash;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    openImport(h);
}
})();
</script>
</body>
</html>
