<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Stretch Tool</title>
<style>
:root {
    --bg: #0b0c0f;
    --surface: #15171c;
    --surface-2: #1d2027;
    --card: #1a1c22;
    --border: #262a32;
    --text: #f2f3f5;
    --muted: #7b8190;
    --green: #34d399;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --red: #f87171;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", Roboto, sans-serif;
}
button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
button:disabled { opacity: .35; cursor: default; }
input, textarea {
    font-family: inherit; font-size: 1rem; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 14px; width: 100%;
}
input:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
.invalid, input.invalid:focus { outline: 2px solid var(--red) !important; outline-offset: -1px; }
.hidden { display: none !important; }
.view { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; }

.btn {
    flex: 1; padding: 13px 14px; border-radius: 12px; font-weight: 600; font-size: .95rem;
    background: var(--surface-2); border: 1px solid var(--border);
}
.btn.primary { background: var(--blue); color: #06121f; border-color: transparent; }

/* ===== 編集画面 (起動時の画面) ===== */
.ed-inner { max-width: 640px; margin: 0 auto; padding: 0 max(18px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
.ed-head {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) 0 12px;
}
.pill {
    display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px;
    border-radius: 999px; background: var(--card); font-size: .95rem; font-weight: 600;
}
.pill svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill.start { background: var(--green); color: #04130c; }
.ed-title { flex: 1; min-width: 0; text-align: center; font-size: .95rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prep-box { background: var(--card); border-radius: 14px; padding: 14px 14px 2px; }
.prep-box .val-btn { background: var(--surface-2); }

.ed-label { font-size: .75rem; letter-spacing: .1em; color: var(--muted); margin: 14px 0 8px 2px; }
.name-input { font-size: 1.35rem; font-weight: 700; padding: 15px 16px; background: var(--card); border-radius: 14px; }

.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 32px 2px 12px; }
.list-head h2 { margin: 0; font-size: 1.15rem; font-weight: 700; }
#list-summary { font-size: .8rem; color: var(--muted); text-align: right; }

.item {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 14px; padding: 12px 4px 12px 14px; margin-bottom: 10px;
}
.item.dragging { opacity: .4; }
.item.drop-target { box-shadow: 0 -2px 0 var(--green); }
.item-no {
    flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2);
    display: grid; place-items: center; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums;
}
.item-body { flex: 1; min-width: 0; cursor: pointer; padding: 4px 0; border-radius: 8px; }
.item-body:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
.item-name { font-size: 1.1rem; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { font-size: .85rem; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.item-more { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.item-more svg { width: 22px; height: 22px; fill: currentColor; }
.item-more:hover, .item-more:active { background: var(--surface-2); }
.empty {
    padding: 26px 18px; text-align: center; line-height: 1.7; font-size: .92rem; color: var(--muted);
    background: var(--card); border-radius: 14px; margin-bottom: 10px;
}
.add-btn {
    width: 100%; height: 54px; border-radius: 14px; font-size: 1rem; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border); margin-top: 4px;
}
.add-btn:hover { background: #242832; }

/* ===== タイマー画面 ===== */
.app {
    height: 100dvh; display: flex; flex-direction: column; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    max-width: 560px; margin: 0 auto;
}
.top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer-name { flex: 1; min-width: 0; text-align: right; color: var(--muted); font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { background: var(--surface); border-radius: 12px; padding: 9px 6px; text-align: center; }
.stat-label { display: block; font-size: .65rem; letter-spacing: .12em; color: var(--muted); margin-bottom: 2px; }
.stat-value { font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-value small { color: var(--muted); font-weight: 400; font-size: .9rem; }
.overall { width: 100%; height: 5px; background: var(--surface-2); border-radius: 3px; margin-top: 12px; overflow: hidden; }
#overall-bar { height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .2s linear; }
.timer-wrap { flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }
.timer-container {
    position: relative; width: min(82vw, 100%, 42dvh, 420px); aspect-ratio: 1;
    display: grid; place-items: center;
}
.timer-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-bg { fill: none; stroke: var(--surface-2); stroke-width: 6; }
.timer-bar { fill: none; stroke: var(--green); stroke-width: 8; stroke-linecap: round; transition: stroke .25s; }
.inner-ui { position: relative; text-align: center; width: 78%; }
#phase-label { font-size: .7rem; letter-spacing: .25em; color: var(--muted); }
#current-title {
    margin: 6px 0 2px; font-size: clamp(1.1rem, 5vw, 1.7rem); font-weight: 500; line-height: 1.25;
    min-height: 2.5em; display: flex; align-items: center; justify-content: center; word-break: break-word;
}
#time-display { font-size: 4.5rem; font-weight: 200; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.controls { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
.side-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    width: 68px; height: 68px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
    font-size: .62rem; letter-spacing: .1em; color: var(--muted);
}
.side-btn svg { width: 22px; height: 22px; fill: var(--text); }
.side-btn:active:not(:disabled) { background: var(--surface-2); }
#main-btn {
    min-width: 160px; height: 68px; padding: 0 30px; border-radius: 999px;
    font-size: 1.15rem; font-weight: 700; letter-spacing: .08em; color: #04130c;
    background: var(--green); transition: background .2s, transform .1s;
}
#main-btn:active:not(:disabled) { transform: scale(.97); }
#main-btn.running { background: var(--red); color: #1c0606; }
#next-up { margin-top: 14px; min-height: 1.4em; font-size: .9rem; color: var(--muted); text-align: center; }
#next-up b { color: var(--text); font-weight: 500; }

/* ===== ルーティーン一覧ページ ===== */
.page-inner { max-width: 560px; margin: 0 auto; padding: 0 max(18px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
.page-head {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 0 12px;
}
.page-head h2 { margin: 0; font-size: 1.7rem; font-weight: 700; }
.page-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 24px; }
.page-actions button {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 54px; border-radius: 14px; background: var(--card); font-size: 1rem; font-weight: 600;
}
.page-actions svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.page-sub { font-size: .95rem; color: var(--muted); margin: 0 0 12px 2px; }
.rc { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 14px; border: 1px solid transparent; }
.rc.active { border-color: rgba(52, 211, 153, .4); }
.rc-top { display: flex; align-items: center; gap: 6px; }
.rc-title { flex: 1; min-width: 0; display: flex; align-items: baseline; }
.rc-name {
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 1.32rem; font-weight: 700; line-height: 1.3;
}
.rc-time { flex: none; white-space: nowrap; margin-left: .45em; font-size: 1.1rem; font-weight: 500; color: #c3c7d1; }
.rc-more { flex: none; width: 44px; height: 44px; margin: -6px -8px -6px 0; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.rc-more svg { width: 24px; height: 24px; fill: currentColor; }
.rc-more:active { background: var(--surface-2); }
.rc-preview {
    margin: 6px 0 0; font-size: .95rem; line-height: 1.5; color: #8b91a0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
}
.rc-start {
    display: block; width: 100%; height: 50px; margin-top: 16px; border-radius: 12px;
    background: var(--green); color: #04130c; font-size: 1.05rem; font-weight: 700; letter-spacing: .06em;
}
.rc-start:active:not(:disabled) { transform: scale(.985); }

/* ===== オーバーレイ / ボトムシート ===== */
.overlay {
    position: fixed; inset: 0; z-index: 200; display: flex;
    background: rgba(0,0,0,.62); align-items: flex-end; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .26s ease, visibility 0s linear .26s;
}
.overlay.open { opacity: 1; visibility: visible; transition: opacity .26s ease, visibility 0s; }
#sheet-picker { z-index: 210; }
.sheet {
    width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto;
    background: var(--card); border-radius: 28px 28px 0 0;
    padding: 18px 18px max(22px, env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.overlay.open .sheet { transform: none; }
.sheet h3 { margin: 0 0 16px; font-size: 1.05rem; text-align: center; }
.sheet .row { display: flex; gap: 10px; margin-top: 16px; }
.sheet textarea { min-height: 96px; resize: vertical; font-size: .8rem; word-break: break-all; }
.note { font-size: .78rem; color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
.grabber { width: 44px; height: 5px; border-radius: 3px; background: #4a4f5b; margin: -6px auto 14px; }
.act-title {
    text-align: center; font-size: 1rem; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    margin-bottom: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.act-list { background: var(--surface-2); border-radius: 16px; overflow: hidden; }
.act-row { width: 100%; height: 62px; display: flex; align-items: center; gap: 16px; padding: 0 18px; font-size: 1.02rem; text-align: left; }
.act-row + .act-row { border-top: 1px solid var(--border); }
.act-row svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act-row:hover:not(:disabled), .act-row:active:not(:disabled) { background: rgba(255,255,255,.05); }
.act-row.danger { color: var(--red); }
.act-sheet { padding-bottom: max(34px, calc(env(safe-area-inset-bottom) + 18px)); }

/* ===== 種目の追加・編集フォーム ===== */
.field { margin-bottom: 16px; }
.field-label { display: block; font-size: .8rem; color: var(--muted); margin: 0 0 7px 2px; }
.val-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 15px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border);
}
.vb-l { flex: 1; font-size: .95rem; color: #c3c7d1; }
.vb-v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.vb-c { color: var(--muted); font-size: 1.3rem; line-height: 1; }
.num-row { display: flex; align-items: center; gap: 10px; }
.num-row input { width: 130px; font-variant-numeric: tabular-nums; }
.num-row .unit { color: var(--muted); }
.num-row .hint { color: var(--muted); font-size: .85rem; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
.seg label { display: block; text-align: center; padding: 11px 6px; border-radius: 9px; font-size: .92rem; color: var(--muted); cursor: pointer; }
.seg input:checked + label { background: #2d313c; color: var(--text); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--blue); }

/* ===== ダイアル式ピッカー (iPhone) ===== */
.wheels { position: relative; display: flex; justify-content: center; gap: 34px; height: 240px; margin: 4px 0 6px; }
.wheel-col { display: flex; align-items: center; gap: 8px; }
.wheel {
    height: 240px; width: 92px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
    mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
}
.wheel::-webkit-scrollbar { display: none; }
.wheel-pad { height: 96px; }
.wheel-item {
    height: 48px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center;
    font-size: 1.4rem; color: #5b6070; font-variant-numeric: tabular-nums; cursor: pointer;
}
.wheel-item.sel { color: var(--text); font-size: 2.5rem; font-weight: 600; }
.wheel-unit { font-size: 1rem; color: var(--muted); }
.wheel-band {
    position: absolute; left: 0; right: 0; top: 96px; height: 48px; pointer-events: none;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: rgba(255,255,255,.03);
}

#toast {
    position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 56px)); transform: translateX(-50%) translateY(-12px);
    background: #fff; color: #000; padding: 10px 18px; border-radius: 999px; font-size: .9rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .2s; z-index: 500; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-height: 640px) {
    .stats { margin-top: 8px; }
    .stat { padding: 5px 4px; }
    .side-btn, #main-btn { height: 56px; }
    .side-btn { width: 56px; }
}
/* iPhone 横画面: 左にリング、右に情報と操作 */
@media (orientation: landscape) and (max-height: 600px) {
    .app {
        max-width: none; width: 100%;
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 20px;
        grid-template-rows: auto 1fr auto auto auto auto;
        grid-template-areas: "ring top" "ring info" "ring stats" "ring overall" "ring next" "ring controls";
        padding: max(10px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    .top { grid-area: top; }
    .phase-block { grid-area: info; align-self: center; text-align: left; }
    .stats { grid-area: stats; margin-top: 8px; gap: 6px; }
    .stat { padding: 5px 4px; }
    .stat-value { font-size: 1rem; }
    .overall { grid-area: overall; margin-top: 8px; }
    #next-up { grid-area: next; margin: 8px 0 0; min-height: 1.2em; text-align: left; font-size: .85rem; }
    .controls { grid-area: controls; margin-top: 8px; width: 100%; gap: 10px; }
    .timer-wrap { grid-area: ring; }
    .timer-container { width: min(100%, calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom))); }
    #current-title { justify-content: flex-start; text-align: left; min-height: 0; margin: 4px 0 0; font-size: clamp(1.15rem, 3.2vw, 1.6rem); }
    .side-btn { width: 56px; height: 56px; }
    #main-btn { height: 56px; min-width: 0; flex: 1; padding: 0 12px; }
}
/* 削除確認ダイアログ (画面中央) */
#dlg-delete { z-index: 220; }
.overlay.center { align-items: center; padding: 24px; }
.dialog {
    width: 100%; max-width: 340px; background: var(--card); border-radius: 20px; padding: 26px 20px 20px; text-align: center;
    transform: scale(.94); opacity: 0; transition: transform .2s ease, opacity .2s ease;
}
.overlay.open .dialog { transform: none; opacity: 1; }
.dialog p { margin: 0 0 22px; font-size: 1.05rem; font-weight: 600; line-height: 1.55; word-break: break-word; }
.dlg-row { display: flex; gap: 10px; }
.btn.danger-fill { background: var(--red); color: #1c0606; border-color: transparent; }

/* Mac (マウス・キーボード): ボトムシートの代わりに中央のダイアログ */
@media (min-width: 700px) and (pointer: fine) {
    .overlay { align-items: center; }
    .sheet {
        max-width: 520px; border-radius: 20px; padding-bottom: 22px;
        transform: translateY(14px) scale(.98); opacity: 0;
        transition: transform .2s ease, opacity .2s ease;
    }
    .overlay.open .sheet { transform: none; opacity: 1; }
    .grabber { display: none; }
    .act-sheet { padding-bottom: 22px; }
}
</style>
</head>
<body>

<!-- ================= 編集画面（起動時） ================= -->
<div class="view hidden" id="editor-view">
  <div class="ed-inner">
    <div class="ed-head">
        <button class="pill" id="ed-cancel">キャンセル</button>
        <span class="ed-title" id="ed-title">ルーティーンを編集</span>
        <button class="pill start" id="ed-save">保存</button>
    </div>

    <p class="ed-label">ルーティーン名</p>
    <input type="text" id="set-routine-name" class="name-input" placeholder="ルーティーン名" maxlength="30" aria-label="ルーティーン名">

    <div class="prep-box" id="prep-field" style="margin-top:18px"></div>
    <p class="note" style="margin:8px 0 0 2px">STARTを押してから最初の種目が始まるまでの時間です。種目ごとの休憩とは別に設定します。</p>

    <div class="list-head">
        <h2>種目</h2>
        <span id="list-summary"></span>
    </div>
    <div id="item-list"></div>
    <button class="add-btn" id="add-open">種目を追加</button>
  </div>
</div>

<!-- ================= タイマー画面 ================= -->
<div class="view hidden" id="timer-view" style="overflow:hidden">
 <div class="app" id="timer-app">
    <header class="top">
        <button class="pill" id="back-btn">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>ルーティーン
        </button>
        <span class="timer-name" id="routine-name">-</span>
    </header>

    <section class="stats">
        <div class="stat"><span class="stat-label">進捗</span><span class="stat-value"><span id="st-step">0</span><small> / <span id="st-count">0</span></small></span></div>
        <div class="stat"><span class="stat-label">残り</span><span class="stat-value" id="st-remain">0:00</span></div>
        <div class="stat"><span class="stat-label">合計</span><span class="stat-value" id="st-total">0:00</span></div>
    </section>
    <div class="overall"><div id="overall-bar"></div></div>

    <div class="timer-wrap">
        <div class="timer-container" id="timer-ring">
            <svg class="timer-svg" viewBox="0 0 400 400">
                <circle class="timer-bg" cx="200" cy="200" r="190"></circle>
                <circle id="progress-bar" class="timer-bar" cx="200" cy="200" r="190"></circle>
            </svg>
            <div class="inner-ui" id="inner-ui">
                <div class="phase-block" id="phase-block">
                    <div id="phase-label">READY</div>
                    <h1 id="current-title">-</h1>
                </div>
                <div id="time-display">0.0</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="side-btn" id="prev-btn" aria-label="前へ">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>PREV
        </button>
        <button id="main-btn">START</button>
        <button class="side-btn" id="skip-btn" aria-label="スキップ">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg>SKIP
        </button>
    </div>
    <div id="next-up"></div>
 </div>
</div>

<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
};
const KEY = 'stretch_v2';
const LIMITS = { time: [1, 3600], rest: [0, 60], prep: [0, 60] };   // 秒
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const isCoarse = () => window.matchMedia('(pointer: coarse)').matches;  // iPhone / iPad → ダイアル式、Mac → 数値入力

/* ================= データ ================= */
function uid() { return Math.random().toString(36).slice(2, 9); }

// 旧データ(ルーティーン共通のwait)を、各種目のrestへ引き継ぐ
function normRoutine(r, fallbackWait) {
    const w = typeof r.wait === 'number' ? r.wait : fallbackWait;
    r.items = (Array.isArray(r.items) ? r.items : []).map(s => ({
        name: String(s.name || '').slice(0, 40),
        time: clamp(parseInt(s.time) || 30, LIMITS.time[0], LIMITS.time[1]),
        type: s.type === 'single' ? 'single' : 'both',
        rest: typeof s.rest === 'number' ? clamp(s.rest, LIMITS.rest[0], LIMITS.rest[1]) : clamp(w, LIMITS.rest[0], LIMITS.rest[1])
    })).filter(s => s.name);
    delete r.wait;
    r.name = String(r.name || 'ルーティーン').slice(0, 30);
    r.prep = typeof r.prep === 'number' ? clamp(r.prep, LIMITS.prep[0], LIMITS.prep[1]) : 0;
    return r;
}
function load() {
    try {
        const s = JSON.parse(localStorage.getItem(KEY));
        if (s && Array.isArray(s.routines) && s.routines.length) {
            s.routines.forEach(r => normRoutine(r, 5));
            if (!s.routines.some(r => r.id === s.activeId)) s.activeId = s.routines[0].id;
            return s;
        }
    } catch (e) {}
    let items = null, wait = 5;
    try { items = JSON.parse(localStorage.getItem('stretch_data')); } catch (e) {}
    try { const w = parseInt(localStorage.getItem('wait_time')); if (!isNaN(w)) wait = w; } catch (e) {}
    const r = normRoutine({
        id: uid(), name: 'マイルーティーン',
        items: (items && items.length) ? items : [{ name: 'ハム', time: 30, type: 'both' }]
    }, wait);
    return { routines: [r], activeId: r.id };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let state = load();
let queue = [];
const cur = () => state.routines.find(r => r.id === state.activeId) || state.routines[0];

// 種目 → 実行ステップ。休憩(rest)は「そのステップの後、次へ進む前」
function stepsOf(items) {
    const q = [];
    items.forEach(s => {
        if (s.type === 'single') {
            q.push({ name: s.name + ' (左)', time: s.time, rest: s.rest });
            q.push({ name: s.name + ' (右)', time: s.time, rest: s.rest });
        } else {
            q.push({ name: s.name, time: s.time, rest: s.rest });
        }
    });
    return q;
}
function rebuild() { queue = stepsOf(cur().items); }
function routineTotalSec(r) {
    const q = stepsOf(r.items);
    return (r.prep || 0) + q.reduce((a, s) => a + s.time, 0) + q.slice(0, -1).reduce((a, s) => a + s.rest, 0);
}
function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    const ss = String(s).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
function fmtJa(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? `${h}時間` : '') + (m ? `${m}分` : '') + (s || !(h || m) ? `${s}秒` : '');
}

/* ================= 音・バイブ・画面スリープ防止 ================= */
let actx = null;
function beep(freq = 800, dur = 0.2, vol = 0.3) {
    try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator(), g = actx.createGain();
        o.connect(g); g.connect(actx.destination);
        o.frequency.value = freq; o.type = 'sine';
        const t = actx.currentTime;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + dur);
        o.start(t); o.stop(t + dur);
    } catch (e) {}
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let wake = null;
async function requestWake() {
    try {
        if ('wakeLock' in navigator && !wake) {
            wake = await navigator.wakeLock.request('screen');
            wake.addEventListener('release', () => { wake = null; });
        }
    } catch (e) {}
}
function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => {
    if (running && document.visibilityState === 'visible') requestWake();
});

/* ================= タイマー ================= */
const circle = $('progress-bar');
const CIRC = 2 * Math.PI * circle.r.baseVal.value;
circle.style.strokeDasharray = `${CIRC} ${CIRC}`;

let phase = 'idle';          // idle | work | wait | done
let idx = 0, elapsed = 0, last = 0, running = false, timerId = null, lastTickKey = '';

// wait は「直前のステップの休憩」
const dur = () => phase === 'prep' ? cur().prep * 1000
               : phase === 'work' ? queue[idx].time * 1000
               : phase === 'wait' ? queue[idx - 1].rest * 1000 : 0;
const nextPhase = () => queue[idx - 1].rest > 0 ? 'wait' : 'work';

function startLoop() {
    running = true; last = performance.now();
    clearInterval(timerId); timerId = setInterval(tick, 50);
    requestWake();
}
function stopLoop() { running = false; clearInterval(timerId); timerId = null; releaseWake(); }
function resetTimer() { stopLoop(); phase = 'idle'; idx = 0; elapsed = 0; lastTickKey = ''; }
function finish() {
    stopLoop(); phase = 'done'; elapsed = 0;
    beep(1000, 0.5); vibrate([300, 100, 300, 100, 300]);
}
function cue() { beep(800, 0.2); vibrate([200, 100, 200]); }

function advance() {
    if (phase === 'work') {
        if (idx + 1 < queue.length) { idx++; phase = nextPhase(); cue(); }
        else finish();
    } else if (phase === 'wait' || phase === 'prep') {
        phase = 'work'; cue();
    }
}
function tick() {
    const now = performance.now();
    elapsed += now - last; last = now;
    let guard = 0;
    while (running && elapsed >= dur() && guard++ < 50) { elapsed -= dur(); advance(); }
    if (running) {
        const sec = Math.ceil((dur() - elapsed) / 1000);
        const key = phase + idx + sec;
        if (sec >= 1 && sec <= 3 && key !== lastTickKey) { lastTickKey = key; beep(620, 0.07, 0.2); }
    }
    renderTimer();
}
function toggle() {
    if (!queue.length) return;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    if (running) { stopLoop(); renderTimer(); return; }
    if (phase === 'idle' || phase === 'done') { idx = 0; phase = cur().prep > 0 ? 'prep' : 'work'; elapsed = 0; lastTickKey = ''; }
    startLoop(); renderTimer();
}
function skip() {
    if (phase === 'idle' || phase === 'done') return;
    elapsed = 0;
    if (phase === 'wait' || phase === 'prep') { phase = 'work'; }
    else if (idx + 1 < queue.length) { idx++; phase = nextPhase(); }
    else { finish(); }
    if (running) last = performance.now();
    renderTimer();
}
function prev() {
    if (phase === 'idle') return;
    if (phase === 'prep') { elapsed = 0; if (running) last = performance.now(); renderTimer(); return; }
    if (phase === 'done') { idx = queue.length - 1; phase = 'work'; elapsed = 0; renderTimer(); return; }
    if ((phase === 'wait' || elapsed <= 3000) && idx > 0) { idx--; }
    phase = 'work'; elapsed = 0;
    if (running) last = performance.now();
    renderTimer();
}

function renderTimer() {
    const n = queue.length;
    const timeBefore = i => queue.slice(0, i).reduce((a, q) => a + q.time, 0) * 1000;
    const restBefore = i => queue.slice(0, Math.max(0, i)).reduce((a, q) => a + q.rest, 0) * 1000;
    const prepMs = cur().prep * 1000;
    const totalMs = prepMs + timeBefore(n) + restBefore(n - 1);

    let completed = 0;
    if (phase === 'prep') completed = elapsed;
    else if (phase === 'work') completed = prepMs + timeBefore(idx) + restBefore(idx) + elapsed;
    else if (phase === 'wait') completed = prepMs + timeBefore(idx) + restBefore(idx - 1) + elapsed;
    else if (phase === 'done') completed = totalMs;

    $('st-count').textContent = n;
    $('st-step').textContent = (phase === 'idle' || phase === 'prep') ? 0 : phase === 'done' ? n : idx + 1;
    $('st-total').textContent = fmt(totalMs / 1000);
    $('st-remain').textContent = fmt(Math.ceil((totalMs - completed) / 1000));
    $('overall-bar').style.width = (totalMs ? Math.min(100, completed / totalMs * 100) : 0) + '%';
    $('routine-name').textContent = cur().name || '(無題)';

    const title = $('current-title'), label = $('phase-label'), next = $('next-up');
    const btn = $('main-btn');
    let ringColor = 'var(--green)', offset = 0, shown = 0;

    if (!n) {
        label.textContent = 'EMPTY'; title.textContent = '種目がありません';
        $('time-display').textContent = '0.0'; next.textContent = '';
    } else if (phase === 'idle') {
        label.textContent = 'READY'; title.textContent = queue[0].name;
        shown = queue[0].time; next.textContent = 'STARTで開始';
    } else if (phase === 'done') {
        label.textContent = 'DONE'; title.textContent = 'FINISH!';
        next.textContent = 'おつかれさまでした';
    } else {
        const d = dur(), rem = Math.max(0, d - elapsed);
        shown = rem / 1000;
        offset = CIRC - (d ? rem / d : 0) * CIRC;
        if (phase === 'prep') {
            ringColor = 'var(--amber)'; label.textContent = 'GET READY'; title.textContent = 'NEXT: ' + queue[0].name;
            next.textContent = 'SKIPで準備を終了';
        } else if (phase === 'wait') {
            ringColor = 'var(--amber)'; label.textContent = 'INTERVAL'; title.textContent = 'NEXT: ' + queue[idx].name;
            next.textContent = 'SKIPで休憩を終了';
        } else {
            label.textContent = 'STRETCH'; title.textContent = queue[idx].name;
            const nx = queue[idx + 1];
            next.textContent = '';
            if (nx) { next.append('次 '); next.appendChild(el('b', null, `${nx.name} · ${nx.time}秒`)); }
            else next.textContent = '最後の種目です';
        }
    }
    if (n) $('time-display').textContent = shown.toFixed(1);
    fitTime();
    circle.style.stroke = ringColor;
    circle.style.strokeDashoffset = offset;

    btn.disabled = !n;
    btn.classList.toggle('running', running);
    btn.textContent = running ? 'PAUSE' : (phase === 'work' || phase === 'wait' || phase === 'prep') ? 'RESUME' : 'START';
    $('prev-btn').disabled = !n || phase === 'idle';
    $('skip-btn').disabled = !n || phase === 'idle' || phase === 'done';
}

/* ================= 画面切り替え ================= */
// 秒数がリングからはみ出さないよう、リング幅と桁数に応じてフォントサイズを調整
function fitTime() {
    const D = $('timer-ring').clientWidth;
    if (!D) return;
    const t = $('time-display');
    const w = [...t.textContent].reduce((a, c) => a + (c === '.' ? 0.3 : 0.6), 0) || 1;
    t.style.fontSize = Math.max(14, Math.min(D * 0.34, D * 0.66 / w)) + 'px';
}
// 横画面: 種目名・フェーズをリングの外 (右側) へ移す
const mqLand = window.matchMedia('(orientation: landscape) and (max-height: 600px)');
function layoutTimer() {
    const blk = $('phase-block'), app = $('timer-app'), inner = $('inner-ui');
    if (mqLand.matches) { if (blk.parentElement !== app) app.appendChild(blk); }
    else if (blk.parentElement !== inner) inner.insertBefore(blk, $('time-display'));
    fitTime();
}
if (mqLand.addEventListener) mqLand.addEventListener('change', layoutTimer); else mqLand.addListener(layoutTimer);
window.addEventListener('resize', layoutTimer);
if (window.ResizeObserver) new ResizeObserver(fitTime).observe($('timer-ring'));

function showView(v) {
    $('home-view').classList.toggle('hidden', v !== 'home');
    $('editor-view').classList.toggle('hidden', v !== 'editor');
    $('timer-view').classList.toggle('hidden', v !== 'timer');
    if (v === 'timer') layoutTimer();
}
function startTimer() {
    if (!queue.length) { toast('種目を追加してください'); return; }
    resetTimer(); showView('timer'); toggle();
}
function backHome() { resetTimer(); showView('home'); renderRoutinePage(); }

function renderAll() { renderTimer(); renderRoutinePage(); }
function activate(id) { state.activeId = id; save(); resetTimer(); rebuild(); renderAll(); }

/* ================= 編集画面 ================= */
const SVG_MORE = '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>';

let editing = null, prepField = null, dragFrom = -1;
const editMutate = fn => { fn(); renderEditor(); };

function openEditor(r, isNew) {
    editing = JSON.parse(JSON.stringify(r));
    $('ed-title').textContent = isNew ? '新規ルーティーン' : 'ルーティーンを編集';
    $('set-routine-name').value = editing.name;
    buildPrepField();
    renderEditor();
    showView('editor');
    $('editor-view').scrollTop = 0;
    if (isNew) setTimeout(() => { $('set-routine-name').focus(); $('set-routine-name').select(); }, 60);
}
function cancelEditor() { editing = null; showView('home'); }
function saveEditor() {
    if (!editing) return;
    const p = prepField.get();
    if (p === null || p < LIMITS.prep[0] || p > LIMITS.prep[1]) {
        prepField.el.classList.add('invalid'); prepField.el.focus();
        toast(`準備時間は${LIMITS.prep[0]}〜${LIMITS.prep[1]}秒で入力してください`);
        return;
    }
    editing.prep = p;
    editing.name = ($('set-routine-name').value.trim() || editing.name || 'ルーティーン').slice(0, 30);
    const i = state.routines.findIndex(x => x.id === editing.id);
    if (i >= 0) state.routines[i] = editing; else state.routines.push(editing);
    editing = null;
    save(); resetTimer(); rebuild(); renderAll();
    showView('home'); toast('保存しました');
}
function buildPrepField() {
    const box = $('prep-field'); box.innerHTML = '';
    const c = secControl('開始前の準備時間', () => editing.prep, v => { editing.prep = v; renderEditor(); },
        LIMITS.prep[0], LIMITS.prep[1], { id: 'prep', zeroText: 'なし' });
    prepField = c.ctl; box.append(c.wrap);
}

function itemSub(s) {
    return [fmtJa(s.time), s.type === 'single' ? '左右' : '両方', s.rest > 0 ? `休憩${fmtJa(s.rest)}` : '休憩なし'].join(' · ');
}
function renderEditor() {
    if (!editing) return;
    const r = editing;
    $('list-summary').textContent = r.items.length
        ? `${r.items.length}種目 · ${stepsOf(r.items).length}ステップ · 合計 ${fmt(routineTotalSec(r))}` : '';

    const list = $('item-list');
    list.innerHTML = '';
    if (!r.items.length) {
        list.appendChild(el('div', 'empty', 'まだ種目がありません。下の「種目を追加」から、最初の種目を入れましょう。'));
        return;
    }
    const fine = !isCoarse();
    r.items.forEach((s, i) => {
        const row = el('div', 'item');
        const no = el('div', 'item-no', String(i + 1));
        const body = el('div', 'item-body');
        body.append(el('div', 'item-name', s.name), el('div', 'item-sub', itemSub(s)));
        body.tabIndex = 0;
        body.onclick = () => openItemSheet(i);
        body.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openItemSheet(i); } };
        const more = el('button', 'item-more');
        more.innerHTML = SVG_MORE; more.setAttribute('aria-label', 'その他の操作');
        more.onclick = () => openItemActions(i);
        row.append(no, body, more);

        if (fine) {   // Mac: ドラッグで並べ替え
            row.draggable = true;
            row.ondragstart = e => { dragFrom = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); row.classList.add('dragging'); };
            row.ondragend = () => { row.classList.remove('dragging'); };
            row.ondragover = e => { e.preventDefault(); row.classList.add('drop-target'); };
            row.ondragleave = () => row.classList.remove('drop-target');
            row.ondrop = e => {
                e.preventDefault(); row.classList.remove('drop-target');
                if (dragFrom >= 0 && dragFrom !== i) moveTo(dragFrom, i);
                dragFrom = -1;
            };
        }
        list.appendChild(row);
    });
}
function moveTo(from, to) {
    const items = editing.items;
    if (to < 0 || to >= items.length) return;
    editMutate(() => { const [m] = items.splice(from, 1); items.splice(to, 0, m); });
}

/* ===== 種目の三点メニュー ===== */
let iaIdx = -1;
function openItemActions(i) {
    iaIdx = i;
    const items = editing.items;
    $('ia-title').textContent = items[i].name;
    $('ia-up').disabled = i === 0;
    $('ia-down').disabled = i === items.length - 1;
    openSheet('sheet-item-actions');
}

/* ===== 種目の追加・編集 (iPhone: ボトムシート / Mac: ダイアログ) ===== */
let editIdx = -1, draft = null, fields = {};
function openItemSheet(i) {
    editIdx = i;
    const s = i >= 0 ? editing.items[i] : null;
    draft = s ? { ...s } : { name: '', time: 30, type: 'both', rest: 5 };
    $('item-sheet-title').textContent = s ? '種目を編集' : '種目を追加';
    buildItemForm();
    openSheet('sheet-item');
    if (!isCoarse()) setTimeout(() => { fields.name.focus(); fields.name.select(); }, 60);
}
function buildItemForm() {
    const box = $('item-form'); box.innerHTML = ''; fields = {};

    const f1 = el('div', 'field');
    const l1 = el('label', 'field-label', '種目名'); l1.htmlFor = 'f-name';
    const ni = document.createElement('input');
    ni.type = 'text'; ni.id = 'f-name'; ni.maxLength = 40; ni.placeholder = '例：ハムストリング'; ni.value = draft.name;
    ni.oninput = () => { draft.name = ni.value; ni.classList.remove('invalid'); };
    f1.append(l1, ni); fields.name = ni;

    const t = secControl('実施時間', () => draft.time, v => { draft.time = v; }, LIMITS.time[0], LIMITS.time[1], { id: 'time' });
    const r = secControl('休憩（この種目のあと）', () => draft.rest, v => { draft.rest = v; }, LIMITS.rest[0], LIMITS.rest[1], { id: 'rest', title: '休憩', zeroText: 'なし' });
    fields.time = t.ctl; fields.rest = r.ctl;
    box.append(f1, t.wrap, sideField(), r.wrap);
}
function sideField() {
    const wrap = el('div', 'field');
    wrap.append(el('div', 'field-label', '左右設定'));
    const seg = el('div', 'seg'); seg.setAttribute('role', 'radiogroup');
    [['both', '両方 1セット'], ['single', '左右 各1セット']].forEach(([v, t]) => {
        const r = document.createElement('input');
        r.type = 'radio'; r.name = 'side'; r.id = 'f-side-' + v; r.value = v; r.checked = draft.type === v;
        r.onchange = () => { draft.type = v; };
        const l = el('label', null, t); l.htmlFor = r.id;
        seg.append(r, l);
    });
    wrap.append(seg);
    return wrap;
}
// 秒数入力: iPhone = ダイアル式ピッカー / Mac = キーボードで直接入力 (＋−ボタン・ダイアルなし)
function secControl(label, get, set, mn, mx, opts) {
    const wrap = el('div', 'field');
    let ctl;
    if (isCoarse()) {
        const b = el('button', 'val-btn'); b.type = 'button';
        const v = el('span', 'vb-v');
        const paint = () => { const x = get(); v.textContent = (opts.zeroText && x === 0) ? opts.zeroText : fmtJa(x); };
        paint();
        b.append(el('span', 'vb-l', label), v, el('span', 'vb-c', '›'));
        b.onclick = () => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            openPicker(opts.title || label, get(), mn, mx, val => { set(val); paint(); });
        };
        wrap.append(b);
        ctl = { get, el: b };
    } else {
        const id = 'f-' + opts.id;
        const lab = el('label', 'field-label', label); lab.htmlFor = id;
        const row = el('div', 'num-row');
        const inp = document.createElement('input');
        inp.type = 'text'; inp.id = id; inp.inputMode = 'numeric'; inp.autocomplete = 'off';
        inp.value = String(get());
        const hint = el('span', 'hint');
        const paint = () => { const n = parseInt(inp.value); hint.textContent = (!isNaN(n) && n >= 60) ? '＝ ' + fmtJa(n) : ''; };
        const clean = () => {
            const raw = inp.value;
            const t = raw.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');
            if (t !== raw) inp.value = t;
        };
        let composing = false, wasFocused = false;
        inp.addEventListener('compositionstart', () => { composing = true; });
        inp.addEventListener('compositionend', () => { composing = false; inp.dispatchEvent(new Event('input')); });
        inp.addEventListener('input', () => {
            if (composing) return;
            clean(); inp.classList.remove('invalid'); paint();
            const t = inp.value.trim();
            if (/^\d+$/.test(t)) { const n = parseInt(t); if (n >= mn && n <= mx) set(n); }
        });
        inp.onmousedown = () => { wasFocused = document.activeElement === inp; };
        inp.onfocus = () => inp.select();
        inp.onmouseup = e => { if (!wasFocused) e.preventDefault(); };   // 最初のクリックで全選択を保つ
        paint();
        row.append(inp, el('span', 'unit', '秒'), hint);
        wrap.append(lab, row);
        ctl = { get: () => { const t = inp.value.trim(); return /^\d+$/.test(t) ? parseInt(t) : null; }, el: inp };
    }
    return { wrap, ctl };
}
function saveItem() {
    const name = fields.name.value.trim();
    if (!name) { fields.name.classList.add('invalid'); fields.name.focus(); return; }
    const out = { name, type: draft.type };
    for (const key of ['time', 'rest']) {
        const [mn, mx] = LIMITS[key];
        const v = fields[key].get();
        if (v === null || v < mn || v > mx) {
            fields[key].el.classList.add('invalid'); fields[key].el.focus();
            toast(`${key === 'time' ? '実施時間' : '休憩'}は${mn}〜${mx}秒で入力してください`);
            return;
        }
        out[key] = v;
    }
    closeSheet('sheet-item');
    const adding = editIdx < 0;
    editMutate(() => { if (adding) editing.items.push(out); else editing.items[editIdx] = out; });
    if (adding) requestAnimationFrame(() => $('add-open').scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
}

/* ===== ダイアル式ピッカー (iPhone) ===== */
const ITEM_H = 48;
let pickerCb = null, pickerRange = [0, 0];
function fillWheel(w, n) {
    w.innerHTML = '';
    w.append(el('div', 'wheel-pad'));
    for (let i = 0; i < n; i++) {
        const it = el('div', 'wheel-item', String(i));
        it.onclick = () => w.scrollTo({ top: i * ITEM_H, behavior: 'smooth' });
        w.append(it);
    }
    w.append(el('div', 'wheel-pad'));
}
function markSel(w) {
    const i = Math.round(w.scrollTop / ITEM_H);
    w.querySelectorAll('.wheel-item').forEach((it, k) => it.classList.toggle('sel', k === i));
}
['wheel-min', 'wheel-sec'].forEach(id => {
    const w = $(id);
    w.addEventListener('scroll', () => {
        if (!w._raf) w._raf = requestAnimationFrame(() => { w._raf = 0; markSel(w); });
    }, { passive: true });
});
function openPicker(title, val, mn, mx, cb) {
    pickerCb = cb; pickerRange = [mn, mx];
    $('picker-title').textContent = title;
    fillWheel($('wheel-min'), Math.floor(mx / 60) + 1);
    fillWheel($('wheel-sec'), 60);
    openSheet('sheet-picker');
    const setPos = () => {
        $('wheel-min').scrollTop = Math.floor(val / 60) * ITEM_H;
        $('wheel-sec').scrollTop = (val % 60) * ITEM_H;
        markSel($('wheel-min')); markSel($('wheel-sec'));
    };
    setPos(); setTimeout(setPos, 60);
}
function commitPicker() {
    const m = Math.round($('wheel-min').scrollTop / ITEM_H);
    const s = Math.round($('wheel-sec').scrollTop / ITEM_H);
    const v = clamp(m * 60 + s, pickerRange[0], pickerRange[1]);
    closeSheet('sheet-picker');
    if (pickerCb) pickerCb(v);
}

/* ================= オーバーレイ共通 ================= */
const openSheet = id => $(id).classList.add('open');
const closeSheet = id => $(id).classList.remove('open');
document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov && !ov.hasAttribute('data-nobackdrop')) ov.classList.remove('open'); });
    ov.querySelectorAll('[data-close]').forEach(b => b.onclick = () => ov.classList.remove('open'));
});
document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    for (const id of ['dlg-delete', 'sheet-picker', 'sheet-item', 'sheet-share', 'sheet-import-box', 'sheet-item-actions', 'sheet-actions']) {
        if ($(id).classList.contains('open')) { closeSheet(id); return; }
    }
});

let toastTimer;
function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ================= ルーティーン一覧 ================= */
function renderRoutinePage() {
    const box = $('routine-list'); box.innerHTML = '';
    $('page-sub').textContent = `マイルーティーン (${state.routines.length})`;
    state.routines.forEach(r => {
        const card = el('div', 'rc' + (r.id === state.activeId ? ' active' : ''));
        const top = el('div', 'rc-top');
        const title = el('div', 'rc-title');
        title.append(el('span', 'rc-name', r.name || '(無題)'), el('span', 'rc-time', `- ${fmtJa(routineTotalSec(r))}`));
        const more = el('button', 'rc-more');
        more.setAttribute('aria-label', 'メニュー'); more.innerHTML = SVG_MORE;
        more.onclick = () => openActions(r.id);
        top.append(title, more);
        const prev = el('p', 'rc-preview', r.items.length ? r.items.map(s => s.name).join('、') : '種目がありません');
        const start = el('button', 'rc-start', '開始');
        start.disabled = !r.items.length;
        start.onclick = () => startRoutine(r.id);
        card.append(top, prev, start);
        box.appendChild(card);
    });
}
function startRoutine(id) { activate(id); startTimer(); }
function newRoutine() {
    openEditor({ id: uid(), name: `ルーティーン ${state.routines.length + 1}`, prep: 10, items: [] }, true);
}
function duplicateRoutine(r) {
    const copy = { id: uid(), name: (r.name + ' のコピー').slice(0, 30), prep: r.prep, items: r.items.map(s => ({ ...s })) };
    state.routines.splice(state.routines.indexOf(r) + 1, 0, copy); save();
    return copy;
}
function deleteRoutine(id) {
    if (state.routines.length <= 1) return;
    const i = state.routines.findIndex(r => r.id === id);
    const wasActive = id === state.activeId;
    state.routines.splice(i, 1);
    if (wasActive) { state.activeId = state.routines[Math.max(0, i - 1)].id; resetTimer(); }
    save(); rebuild(); renderAll();
}

/* ===== ルーティーンの三点メニュー ===== */
let actionId = null, deleteId = null;
function openActions(id) {
    const r = state.routines.find(x => x.id === id); if (!r) return;
    actionId = id;
    $('act-title').textContent = r.name || '(無題)';
    $('act-del').disabled = state.routines.length <= 1;
    openSheet('sheet-actions');
}
const actionRoutine = () => state.routines.find(x => x.id === actionId);

/* ===== 共有コード ===== */
function enc(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let s = ''; bytes.forEach(c => s += String.fromCharCode(c));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function dec(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    const bin = atob(str);
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
function shareCode(r) {
    return enc({ v: 3, n: r.name, p: r.prep, i: r.items.map(s => [s.name, s.time, s.type, s.rest]) });
}
function parseShared(text) {
    try {
        text = (text || '').trim();
        const k = text.indexOf('#r=');
        if (k >= 0) text = text.slice(k + 3);
        text = text.replace(/\s+/g, '');
        if (!text) return null;
        const o = dec(text);
        if (!o || !Array.isArray(o.i)) return null;
        const oldWait = parseInt(o.w);   // 旧形式: ルーティーン共通の休憩
        const items = o.i.map(a => {
            const rest = a[3] !== undefined ? parseInt(a[3]) : oldWait;
            return {
                name: String(a[0] || '').slice(0, 40),
                time: clamp(parseInt(a[1]) || 30, LIMITS.time[0], LIMITS.time[1]),
                type: a[2] === 'single' ? 'single' : 'both',
                rest: clamp(isNaN(rest) ? 5 : rest, LIMITS.rest[0], LIMITS.rest[1])
            };
        }).filter(s => s.name).slice(0, 100);
        if (!items.length) return null;
        const pp = parseInt(o.p);
        return { id: uid(), name: String(o.n || '共有ルーティーン').slice(0, 30), prep: isNaN(pp) ? 0 : clamp(pp, LIMITS.prep[0], LIMITS.prep[1]), items };
    } catch (e) { return null; }
}
async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) {}
    const ta = $('share-code'); ta.value = text; ta.focus(); ta.select();
    try { document.execCommand('copy'); toast(okMsg); } catch (e) { toast('コピーできませんでした'); }
}
let shareTarget = null;
function openShare(r) {
    shareTarget = r || cur();
    $('share-code').value = shareCode(shareTarget);
    openSheet('sheet-share');
}
const shareLink = () => location.href.split('#')[0] + '#r=' + shareCode(shareTarget || cur());

let pendingImport = null;
function openImport(prefill) {
    $('import-text').value = prefill || '';
    updateImportPreview();
    openSheet('sheet-import-box');
}
function updateImportPreview() {
    pendingImport = parseShared($('import-text').value);
    const p = $('import-preview');
    if (pendingImport) {
        p.textContent = `「${pendingImport.name}」 ${pendingImport.items.length}種目 ・ 合計 ${fmt(routineTotalSec(pendingImport))}`;
        p.style.color = 'var(--green)';
    } else {
        p.textContent = $('import-text').value.trim() ? 'コードを読み取れません' : '';
        p.style.color = 'var(--red)';
    }
    $('import-go').disabled = !pendingImport;
}

/* ================= イベント登録 ================= */
$('ed-cancel').onclick = cancelEditor;
$('ed-save').onclick = saveEditor;
$('back-btn').onclick = backHome;
$('main-btn').onclick = toggle;
$('prev-btn').onclick = prev;
$('skip-btn').onclick = skip;
$('add-open').onclick = () => openItemSheet(-1);

$('set-routine-name').oninput = e => { if (editing) editing.name = e.target.value.slice(0, 30); };

$('item-cancel').onclick = () => closeSheet('sheet-item');
$('item-save').onclick = saveItem;
$('item-form').onkeydown = e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
        e.preventDefault();
        if (!isCoarse()) saveItem(); else e.target.blur();
    }
};
$('picker-cancel').onclick = () => closeSheet('sheet-picker');
$('picker-ok').onclick = commitPicker;

$('ia-edit').onclick = () => { closeSheet('sheet-item-actions'); openItemSheet(iaIdx); };
$('ia-up').onclick = () => { closeSheet('sheet-item-actions'); moveTo(iaIdx, iaIdx - 1); };
$('ia-down').onclick = () => { closeSheet('sheet-item-actions'); moveTo(iaIdx, iaIdx + 1); };
$('ia-del').onclick = () => { closeSheet('sheet-item-actions'); editMutate(() => editing.items.splice(iaIdx, 1)); };

$('page-new').onclick = newRoutine;
$('page-import').onclick = () => openImport('');

$('act-share').onclick = () => { const r = actionRoutine(); closeSheet('sheet-actions'); if (r) openShare(r); };
$('act-dup').onclick = () => {
    const r = actionRoutine(); closeSheet('sheet-actions');
    if (r) { duplicateRoutine(r); renderAll(); toast('複製しました'); }
};
$('act-edit').onclick = () => {
    const id = actionId; closeSheet('sheet-actions');
    const r = state.routines.find(x => x.id === id);
    if (r) openEditor(r, false);
};
$('act-del').onclick = () => {
    const r = actionRoutine(); closeSheet('sheet-actions');
    if (!r || state.routines.length <= 1) return;
    deleteId = r.id;
    $('del-msg').textContent = `『${r.name || '(無題)'}』を削除しますか？`;
    openSheet('dlg-delete');
};
$('del-yes').onclick = () => {
    const id = deleteId; deleteId = null; closeSheet('dlg-delete');
    if (id) { deleteRoutine(id); toast('削除しました'); }
};
$('del-no').onclick = () => { deleteId = null; closeSheet('dlg-delete'); };

$('copy-code').onclick = () => copyText($('share-code').value, 'コードをコピーしました');
$('copy-link').onclick = () => copyText(shareLink(), 'リンクをコピーしました');
$('native-share').onclick = async () => {
    const nm = (shareTarget || cur()).name;
    const data = { title: `ストレッチ: ${nm}`, text: `ストレッチルーティーン「${nm}」\n${shareLink()}` };
    if (navigator.share) { try { await navigator.share(data); } catch (e) {} }
    else copyText(shareLink(), 'リンクをコピーしました');
};
$('import-text').oninput = updateImportPreview;
$('import-go').onclick = () => {
    if (!pendingImport) return;
    state.routines.push(pendingImport); save();
    activate(pendingImport.id);
    closeSheet('sheet-import-box'); toast('取り込みました');
};

/* ================= 起動 ================= */
rebuild();
renderAll();
showView('home');
if (location.hash.startsWith('#r=')) {
    const h = location.hash;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    openImport(h);
}
})();
</script>
</body>
</html>
